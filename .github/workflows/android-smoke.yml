name: Android Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch exact Arc revision
        run: |
          git init ../Arc
          cd ../Arc
          git remote add origin https://github.com/Anuken/Arc.git
          git fetch --depth=1 origin 8eb00ffff0126d0576c67df46f99b8f6bccd96fe
          git checkout --detach 8eb00ffff0126d0576c67df46f99b8f6bccd96fe

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use CI debug signing for release variant
        run: |
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' android/build.gradle

      - name: Generate packed assets
        run: ./gradlew pack --stacktrace

      - name: Build Android release APK
        run: ./gradlew android:assembleRelease -Pbuildversion=160.5 -PversionType=official -PshowCommitHash --stacktrace

      - name: Run startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install -r android/build/outputs/apk/release/android-release.apk
            adb logcat -c
            adb shell am start -W -n io.anuke.ironfront/mindustry.android.AndroidLauncher
            sleep 20
            echo "=== PROCESS ==="
            pid="$(adb shell pidof io.anuke.ironfront | tr -d '\r')"
            echo "pid=$pid"
            echo "=== LOGCAT ==="
            adb logcat -d -t 1500
            test -n "$pid"
