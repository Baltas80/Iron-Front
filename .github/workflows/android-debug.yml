name: Android Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch matching Arc
        run: |
          git init ../Arc
          cd ../Arc
          git remote add origin https://github.com/Anuken/Arc.git
          git fetch --depth=1 origin 8eb00ffff0126d0576c67df46f99b8f6bccd96fe
          git checkout --detach 8eb00ffff0126d0576c67df46f99b8f6bccd96fe

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Disable R8 for debug build
        run: |
          sed -i 's/minifyEnabled = true/minifyEnabled = false/' android/build.gradle
          sed -i 's/shrinkResources = true/shrinkResources = false/' android/build.gradle

      - name: Build Android debug APK
        run: ./gradlew android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-front-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
