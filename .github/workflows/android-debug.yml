name: Android Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Arc
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: |
          cat > /tmp/iron-front-debug.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              project(":android").android.buildTypes.debug.minifyEnabled = false
              project(":android").android.buildTypes.debug.shrinkResources = false
          }
          EOF
          ./gradlew android:assembleDebug --stacktrace --init-script /tmp/iron-front-debug.init.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-front-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
