name: Android Test APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch exact Arc revision
        run: |
          git init ../Arc
          cd ../Arc
          git remote add origin https://github.com/Anuken/Arc.git
          git fetch --depth=1 origin 8eb00ffff0126d0576c67df46f99b8f6bccd96fe
          git checkout --detach 8eb00ffff0126d0576c67df46f99b8f6bccd96fe

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make release installable for CI
        run: |
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' android/build.gradle

      - name: Generate packed assets
        run: ./gradlew pack --stacktrace

      - name: Build Android release APK
        run: ./gradlew android:assembleRelease -Pbuildversion=160.5 -PversionType=official -PshowCommitHash --stacktrace

      - name: Verify APK
        run: |
          test -s android/build/outputs/apk/release/android-release.apk
          ls -lh android/build/outputs/apk/release/android-release.apk
          sha256sum android/build/outputs/apk/release/android-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-front-android-release-test
          path: android/build/outputs/apk/release/android-release.apk
          if-no-files-found: error
